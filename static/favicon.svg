<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#primary-grad)" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="32" cy="32" r="14" fill="url(#primary-grad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="7" fill="#0b0f19"/>
  <circle cx="32" cy="14" r="3.5" fill="#38bdf8"/>
  <circle cx="32" cy="50" r="3.5" fill="#c084fc"/>
  <circle cx="14" cy="32" r="3.5" fill="#22d3ee"/>
  <circle cx="50" cy="32" r="3.5" fill="#a855f7"/>
  <line x1="32" y1="18" x2="32" y2="25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="39" x2="32" y2="46" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="25" y2="32" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="32" x2="46" y2="32" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
</svg>
